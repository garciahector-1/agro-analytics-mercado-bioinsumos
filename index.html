<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro-Analytics Mercosur 2026 - Presentación Executive</title>
    <style>
        :root {
            --primary: #1e3f20;
            --secondary: #3b6e3d;
            --accent: #e67e22;
            --dark: #2c3e50;
            --light: #f8f9fa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #eef2f3; 
            color: var(--dark); 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: flex-start;
            min-height: 100vh; 
            padding: 20px 20px 80px 20px; /* Espacio para los controles fijos abajo */
        }

        .deck-container { 
            width: 100%;
            max-width: 900px; 
            height: calc(100vh - 160px); 
            min-height: 480px;
            max-height: 620px;
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.15); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            position: relative;
            margin-top: auto;
            margin-bottom: auto;
        }

        .progress-bar { height: 6px; background: #ddd; width: 100%; }
        .progress-fill { height: 100%; background: var(--accent); width: 3.84%; transition: width 0.3s ease; }
        
        .slide { 
            flex: 1; 
            display: none; 
            padding: 35px 50px; 
            flex-direction: column; 
            justify-content: center; 
            overflow-y: auto; 
        }
        .slide.active { display: flex; }

        h1 { font-size: 28px; color: var(--primary); margin-bottom: 12px; border-bottom: 3px solid var(--accent); padding-bottom: 6px; display: inline-block; }
        h2 { font-size: 20px; color: var(--secondary); margin-bottom: 12px; }
        p { font-size: 15px; line-height: 1.6; margin-bottom: 12px; }
        ul { margin-left: 25px; margin-bottom: 12px; font-size: 15px; line-height: 1.5; }
        li { margin-bottom: 6px; }
        .highlight { font-weight: bold; color: var(--accent); }
        
        /* CONTROLES FIJOS EN LA PARTE INFERIOR */
        .controls { 
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px; 
            background: var(--primary); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 30px; 
            z-index: 1000;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
        }

        .btn { background: var(--secondary); color: white; border: none; padding: 10px 24px; font-size: 14px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: var(--accent); }
        .slide-number { color: white; font-size: 14px; opacity: 0.8; font-weight: bold; }
        
        .flex-container { display: flex; gap: 20px; margin-top: 10px; }
        .card { flex: 1; background: var(--light); padding: 15px; border-radius: 8px; border-left: 4px solid var(--secondary); }
